# ── Head (Pi 3) Configuration ──────────────────────────────────────────────────
# Runs on the Pi 3. Port must match config_backbone.yaml.

network:
  port: 5000

model:
  head: models/split/head_320.onnx
  imgsz: 320                  # must match config_backbone.yaml

detection:
  conf_threshold: 0.5
  target_class: 0             # 0=leopard, -1=all classes

output:
  save: false                 # true = save annotated images to results/detections/
  display: false              # true = show window (requires display)
