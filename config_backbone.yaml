# ── Backbone (Pi) Configuration ───────────────────────────────────────────────
# Runs on the Pi Zero 2 W. Edit head_ip to match the head device.

network:
  head_ip: 192.168.1.10       # address of the head device
  port: 5000

model:
  backbone: models/split/backbone_320.onnx
  imgsz: 320                  # must match config_head.yaml

source:
  type: images                # images | camera
  images_path: data/v2_yolo_dataset/valid/images
  camera_device: 0
  fps: 2                      # only used when type = images
